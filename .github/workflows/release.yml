name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  binaries:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller .
      - name: Build one-file app
        run: >
          pyinstaller --onefile --windowed --name antasena
          --collect-submodules antasena packaging/launch.py
      - uses: actions/upload-artifact@v4
        with:
          name: antasena-${{ runner.os }}
          path: dist/*
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
