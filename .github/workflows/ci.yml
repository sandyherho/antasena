name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - name: Tests (virtual display on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m pytest
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m pytest
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,reference]"
      - run: HYPOTHESIS_PROFILE=thorough python -m pytest tests/test_eos.py tests/test_buhlmann.py tests/test_toxicity.py
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt -e ".[test]"
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m pytest tests/test_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typeset every equation with MathJax 4
        run: |
          npm install --no-save @mathjax/src@4
          python tools/check_math.py docs/_build/html
